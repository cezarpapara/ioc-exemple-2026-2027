<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schimb valutar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #eef2f3; padding-bottom: 90px; }
    .antet { background: #0e4d5c; color: #fff; }
    .rezultat { background: #e7f3f5; border-radius: .75rem; }
    .chitanta { font-family: ui-monospace, Consolas, monospace; font-size: .9rem; }
    .curs-ales { font-weight: 700; text-decoration: underline; }
  </style>
</head>
<body>
  <header class="antet py-3 mb-4"><div class="container"><h1 class="h4 mb-0">Casa de schimb valutar</h1>
    <small class="opacity-75">Ghișeul 1 · cursuri demonstrative, valabile azi</small></div></header>
  <main class="container">
    <div class="row g-4">
      <section class="col-lg-7">
        <div class="card border-0 shadow-sm"><div class="card-body p-4">
          <div id="mesaj"></div>
          <h2 class="h5 mb-3">Operațiune nouă</h2>
          <div class="btn-group w-100 mb-1" role="group" aria-label="Tipul operațiunii">
            <input type="radio" class="btn-check" name="op" id="opV" value="1" checked><label class="btn btn-outline-primary py-2" for="opV">Clientul cumpără valută</label>
            <input type="radio" class="btn-check" name="op" id="opC" value="0"><label class="btn btn-outline-primary py-2" for="opC">Clientul vinde valută</label>
          </div>
          <p id="explicatie" class="small text-body-secondary mb-3"></p>
          <div class="row g-3">
            <div class="col-sm-6"><label for="mon" class="form-label">Moneda</label><select id="mon" class="form-select"></select></div>
            <div class="col-sm-6"><label for="suma" class="form-label">Suma în valută</label>
              <div class="input-group has-validation"><input id="suma" class="form-control" inputmode="numeric" placeholder="de exemplu 100">
                <span class="input-group-text" id="cod">EUR</span><div class="invalid-feedback" id="eroare"></div></div>
              <div class="form-text">Doar sume întregi: casa nu lucrează cu monede în valută.</div></div>
          </div>
          <div class="rezultat p-3 mt-3">
            <div class="small text-body-secondary" id="cursAplicat"></div>
            <div class="d-flex justify-content-between align-items-baseline flex-wrap"><span id="eticheta">Clientul plătește</span><span id="total" class="fs-3 fw-bold">–</span></div>
          </div>
          <div class="d-flex gap-2 mt-3">
            <button id="emite" class="btn btn-primary btn-lg flex-grow-1" disabled>Emite chitanța</button>
            <button id="goleste" class="btn btn-outline-secondary btn-lg" data-bs-toggle="tooltip" title="Șterge suma și începe o operațiune nouă">Golește</button>
          </div>
        </div></div>
      </section>
      <aside class="col-lg-5">
        <div class="card border-0 shadow-sm"><div class="card-body p-4">
          <h2 class="h5 mb-3">Cursul zilei (lei pentru o unitate)</h2>
          <table class="table align-middle mb-0">
            <thead><tr><th>Moneda</th>
              <th class="text-end"><span data-bs-toggle="tooltip" title="Prețul cu care casa cumpără valuta de la client">Cumpărare</span></th>
              <th class="text-end"><span data-bs-toggle="tooltip" title="Prețul cu care casa vinde valuta clientului">Vânzare</span></th></tr></thead>
            <tbody id="cursuri"></tbody>
          </table>
        </div></div>
      </aside>
    </div>
  </main>
  <div class="modal fade" id="modalChitanta" tabindex="-1" aria-labelledby="tCh" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5" id="tCh">Chitanța a fost emisă</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Închide"></button></div>
    <div class="modal-body"><div id="chitanta" class="chitanta border rounded p-3 bg-body-tertiary"></div></div>
    <div class="modal-footer"><button class="btn btn-outline-secondary" onclick="window.print()">Tipărește</button><button class="btn btn-primary" data-bs-dismiss="modal">Gata</button></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Cursuri demonstrative: [cumparare, vanzare], in lei pentru o unitate
    const CURS = { EUR: ['euro', 4.95, 5.08], USD: ['dolar american', 4.35, 4.49], GBP: ['liră sterlină', 5.78, 5.94], CHF: ['franc elvețian', 5.28, 5.43] };
    const MAX = 10000;
    const $ = id => document.getElementById(id);
    const fmt = (v, z = 2) => v.toLocaleString('ro-RO', { minimumFractionDigits: z, maximumFractionDigits: z });
    let nrChitanta = 125;
    const modal = new bootstrap.Modal($('modalChitanta'));

    Object.entries(CURS).forEach(([cod, [nume, c, v]]) => {
      $('mon').insertAdjacentHTML('beforeend', `<option value="${cod}">${cod} – ${nume}</option>`);
      $('cursuri').insertAdjacentHTML('beforeend', `<tr data-cod="${cod}"><td><strong>${cod}</strong> <span class="small text-body-secondary">${nume}</span></td>
        <td class="text-end">${fmt(c, 4)}</td><td class="text-end">${fmt(v, 4)}</td></tr>`);
    });
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));

    // Citim suma: acceptam si virgula; intoarcem {suma} sau {eroare}
    function citesteSuma() {
      const t = $('suma').value.trim().replace(/\s/g, ''), cod = $('mon').value;
      if (t === '') return { eroare: '' };
      const s = Number(t.replace(',', '.'));
      if (isNaN(s) || s <= 0) return { eroare: 'Introduceți o sumă pozitivă, de exemplu 100.' };
      if (!Number.isInteger(s)) return { eroare: `Introduceți o sumă întreagă de ${cod}, fără zecimale.` };
      if (s > MAX) return { eroare: `Suma maximă pentru o operațiune este ${fmt(MAX, 0)} ${cod}.` };
      return { suma: s };
    }
    function calcul() {
      const cod = $('mon').value, vinde = document.querySelector('input[name=op]:checked').value === '1';
      const rata = CURS[cod][vinde ? 2 : 1], r = citesteSuma();
      $('cod').textContent = cod;
      $('explicatie').textContent = vinde ? `Clientul dă lei și primește ${cod}. Se aplică cursul de vânzare.` : `Clientul dă ${cod} și primește lei. Se aplică cursul de cumpărare.`;
      $('eticheta').textContent = vinde ? 'Clientul plătește' : 'Clientul primește';
      $('cursAplicat').textContent = `Curs aplicat: 1 ${cod} = ${fmt(rata, 4)} lei`;
      document.querySelectorAll('#cursuri tr').forEach(tr => {
        tr.classList.toggle('table-active', tr.dataset.cod === cod);
        tr.querySelectorAll('td').forEach((td, i) => td.classList.toggle('curs-ales', tr.dataset.cod === cod && i === (vinde ? 2 : 1)));
      });
      $('suma').classList.toggle('is-invalid', !!r.eroare); $('eroare').textContent = r.eroare || '';
      $('total').textContent = r.suma ? fmt(Math.round(r.suma * rata * 100) / 100) + ' lei' : '–';
      $('emite').disabled = !r.suma;
      return r.suma ? { cod, vinde, rata, suma: r.suma, lei: Math.round(r.suma * rata * 100) / 100 } : null;
    }

    ['suma', 'mon'].forEach(id => $(id).addEventListener('input', calcul));
    document.querySelectorAll('input[name=op]').forEach(r => r.addEventListener('change', calcul));
    $('emite').onclick = () => {
      const o = calcul(); if (!o) return;
      const nr = String(nrChitanta++).padStart(6, '0');
      $('chitanta').innerHTML = `<div class="text-center fw-bold">CHITANȚĂ DE SCHIMB VALUTAR</div><div class="text-center mb-2">nr. ${nr} · ${new Date().toLocaleString('ro-RO')}</div>
        <div>Operațiune: ${o.vinde ? 'vânzare de valută către client' : 'cumpărare de valută de la client'}</div>
        <div>Suma: ${fmt(o.suma, 0)} ${o.cod}</div><div>Curs: ${fmt(o.rata, 4)} lei / ${o.cod}</div>
        <div class="fw-bold mt-1">${o.vinde ? 'Încasat' : 'Plătit'}: ${fmt(o.lei)} lei</div><div class="small mt-2">Comision: 0,00 lei</div>`;
      modal.show();
      $('mesaj').innerHTML = `<div class="alert alert-success alert-dismissible">Chitanța nr. ${nr} a fost emisă. Puteți începe o operațiune nouă.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Închide"></button></div>`;
      $('suma').value = ''; calcul();
    };
    $('goleste').onclick = () => { $('suma').value = ''; $('mesaj').innerHTML = ''; calcul(); $('suma').focus(); };
    calcul();
  </script>
  <script src="../../assets/nivel.js" data-nivel="3"></script>
</body>
</html>
