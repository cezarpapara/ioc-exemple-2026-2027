<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Panou seră</title>
<style>
  body { background: #9e9e9e; font-family: Arial, sans-serif; font-size: 11px; color: #757575; margin: 12px; }
  h4 { margin: 0 0 6px; color: #8a8a8a; }
  table { border-collapse: collapse; background: #a8a8a8; }
  td { border: 1px solid #939393; padding: 3px 8px; }
  td.alarma { background: #d32f2f; color: #c62828; }
  button { font-size: 9px; padding: 0 3px; background: #b0b0b0; border: 1px solid #999; color: #777; }
  #istoric { width: 600px; word-wrap: break-word; color: #8d8d8d; font-size: 9px; }
</style>
</head>
<body>
<h4>SERA2 / PLC-07 / HMI v0.9</h4>
<table>
  <tr><td>T1</td><td id="t1"></td><td>H1</td><td id="h1"></td><td>S1</td><td id="s1"></td></tr>
</table>
<p>CMD: <button id="v">V</button> <button id="i">I</button> <button id="h">H</button></p>
<p>Istoric T1:</p>
<div id="istoric"></div>

<script>
  // Valori brute: temperatura, umiditate, umiditatea solului ca valoare ADC (0-1023)
  let t1 = 24.5, h1 = 70, s1 = 600;
  let v = false, irig = false, inc = false;
  const istoric = [];

  // Butoanele comuta starea, dar nu arata nicaieri daca sunt pornite
  document.getElementById('v').onclick = function () { v = !v; };
  document.getElementById('i').onclick = function () { irig = !irig; };
  document.getElementById('h').onclick = function () { inc = !inc; };

  // Actualizare rapida, cu doua zecimale, care face cifrele greu de citit
  setInterval(function () {
    t1 += (v ? -0.35 : 0.25) + (inc ? 0.3 : 0) + (Math.random() - 0.5) * 0.4;
    h1 += (v ? -0.4 : 0.15) + (Math.random() - 0.5) * 1;
    s1 += (irig ? 12 : -3) + (Math.random() - 0.5) * 4;
    document.getElementById('t1').textContent = t1.toFixed(2);
    document.getElementById('h1').textContent = h1.toFixed(2);
    document.getElementById('s1').textContent = Math.round(s1);
    // Alarma este semnalata doar prin culoarea celulei
    document.getElementById('t1').className = t1 > 30 ? 'alarma' : '';
    document.getElementById('h1').className = h1 > 90 ? 'alarma' : '';
    document.getElementById('s1').className = s1 < 350 ? 'alarma' : '';
    istoric.push(t1.toFixed(2));
    document.getElementById('istoric').textContent = istoric.join(', ');
  }, 500);
</script>
<script src="../../assets/nivel.js" data-nivel="1"></script>
</body>
</html>
