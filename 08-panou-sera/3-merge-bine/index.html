<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panou seră</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .valoare { font-size: 2.6rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .card.alarma { border: 3px solid var(--bs-danger); } .card.atentie { border: 3px solid var(--bs-warning); }
    .grafic { position: relative; height: 260px; }
  </style>
</head>
<body class="bg-body-tertiary">
<header class="bg-dark text-white py-3 mb-3"><div class="container d-flex flex-wrap align-items-center gap-2">
  <h1 class="h4 mb-0 me-auto">Sera 2 – roșii</h1><span class="small opacity-75">Date simulate · actualizare la 2 secunde · <span id="ceas"></span></span></div></header>
<main class="container pb-5">
  <div id="banner" class="alert mb-3" role="status"></div>
  <div class="row g-3 mb-3" id="carduri"></div>
  <div class="row g-3">
    <section class="col-lg-4"><div class="card shadow-sm h-100"><div class="card-body">
      <h2 class="h6">Comenzi</h2>
      <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" role="switch" id="vent">
        <label class="form-check-label" for="vent">Ventilație: <b id="ventText">oprită</b></label></div>
      <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" role="switch" id="inc">
        <label class="form-check-label" for="inc">Încălzire: <b id="incText">oprită</b></label></div>
      <button class="btn btn-primary w-100" id="irigare" data-bs-toggle="tooltip" data-bs-title="Pornește pompa de irigare timp de un minut">Pornește irigarea (1 minut)</button>
      <p class="small text-secondary mt-2 mb-0" id="irigareText">Irigarea este oprită.</p>
    </div></div></section>
    <section class="col-lg-8"><div class="card shadow-sm h-100"><div class="card-body">
      <h2 class="h6">Evoluție în ultimele 2 minute</h2>
      <div class="grafic"><canvas id="grafic" aria-label="Graficul temperaturii și al umidității solului" role="img"></canvas></div>
    </div></div></section>
  </div>
  <section class="card shadow-sm mt-3"><div class="card-body">
    <h2 class="h6">Jurnal de alarme</h2>
    <div class="table-responsive"><table class="table table-sm align-middle mb-0">
      <thead><tr><th>Ora</th><th class="d-none d-sm-table-cell">Parametru</th><th>Mesaj</th><th></th></tr></thead><tbody id="jurnal"></tbody></table></div>
  </div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
  // Limitele: [min, max] = intervalul normal; [amin, amax] = pragurile de alarma
  const S = {
    temp: { nume: 'Temperatura aerului', unit: '°C', val: 24.5, min: 18, max: 26, amin: 12, amax: 30, info: 'Senzor în centrul serei, la 1,5 m înălțime' },
    umid: { nume: 'Umiditatea aerului', unit: '%', val: 70, min: 60, max: 80, amin: 50, amax: 90, info: 'Umiditate relativă a aerului' },
    sol: { nume: 'Umiditatea solului', unit: '%', val: 42, min: 35, max: 60, amin: 25, amax: 75, info: 'Media celor 4 senzori din straturi' },
  };
  const RANG = { normal: 0, atentie: 1, alarma: 2 };
  const ETICHETE = { normal: ['Normal', 'success', '●'], atentie: ['Atenție', 'warning', '▲'], alarma: ['Alarmă', 'danger', '■'] };
  const cmd = { vent: false, inc: false };
  let irigare = 0, jurnal = [];
  const $ = id => document.getElementById(id);
  const nr = x => x.toFixed(1).replace('.', ',');
  const ora = (d = new Date()) => d.toLocaleTimeString('ro-RO');
  const stare = s => s.val < s.amin || s.val > s.amax ? 'alarma' : s.val < s.min || s.val > s.max ? 'atentie' : 'normal';

  $('carduri').innerHTML = Object.keys(S).map(k => `<div class="col-md-4"><div class="card shadow-sm h-100" id="c-${k}"><div class="card-body">
    <div class="d-flex justify-content-between"><h2 class="h6 text-secondary mb-1" data-bs-toggle="tooltip" data-bs-title="${S[k].info}">${S[k].nume}</h2><span id="b-${k}"></span></div>
    <div class="valoare"><span id="v-${k}"></span> <small class="fs-5 text-secondary">${S[k].unit}</small></div>
    <div class="small text-secondary">Interval normal: ${S[k].min}–${S[k].max} ${S[k].unit} · alarmă sub ${S[k].amin} sau peste ${S[k].amax}</div></div></div></div>`).join('');
  document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));

  const grafic = new Chart($('grafic'), {
    type: 'line',
    data: { labels: [], datasets: [
      { label: 'Temperatura aerului (°C)', data: [], borderColor: '#d9480f', backgroundColor: '#d9480f', yAxisID: 'y', pointRadius: 0, tension: 0.3 },
      { label: 'Umiditatea solului (%)', data: [], borderColor: '#1c7ed6', backgroundColor: '#1c7ed6', yAxisID: 'y1', pointRadius: 0, tension: 0.3 }] },
    options: { animation: false, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: { y: { title: { display: true, text: 'Temperatură (°C)' }, suggestedMin: 15, suggestedMax: 32 },
        y1: { position: 'right', title: { display: true, text: 'Umiditatea solului (%)' }, suggestedMin: 20, suggestedMax: 70, grid: { drawOnChartArea: false } } } },
  });

  // Simularea procesului: soarele incalzeste sera, ventilatia o raceste, solul se usuca
  function simuleaza() {
    S.temp.val += (cmd.vent ? -0.35 : 0.25) + (cmd.inc ? 0.3 : 0) + (Math.random() - 0.5) * 0.2;
    S.umid.val += (cmd.vent ? -0.4 : 0.15) + (Math.random() - 0.5) * 0.5;
    S.sol.val += irigare > 0 ? 1.2 : -0.25;
    if (irigare > 0) irigare--;
  }

  function actualizeaza(d = new Date()) {
    Object.entries(S).forEach(([k, s]) => {
      const st = stare(s), [txt, cul, simbol] = ETICHETE[st];
      $('v-' + k).textContent = nr(s.val);
      $('b-' + k).innerHTML = `<span class="badge text-bg-${cul}">${simbol} ${txt}</span>`;
      $('c-' + k).className = 'card shadow-sm h-100 ' + (st === 'normal' ? '' : st);
      // Alarma se inregistreaza o singura data, cand starea se agraveaza
      if (s.stare && RANG[st] > RANG[s.stare]) jurnal.unshift({ ora: ora(d), k, st, text: `${txt}: ${nr(s.val)} ${s.unit} ` +
        (s.val > s.max ? `(peste ${st === 'alarma' ? s.amax : s.max} ${s.unit})` : `(sub ${st === 'alarma' ? s.amin : s.min} ${s.unit})`) });
      s.stare = st;
    });
    const active = Object.values(S).filter(s => s.stare === 'alarma'), atentie = Object.values(S).filter(s => s.stare === 'atentie');
    $('banner').className = 'alert mb-3 fw-semibold alert-' + (active.length ? 'danger' : atentie.length ? 'warning' : 'success');
    $('banner').textContent = active.length ? `■ ${active.length === 1 ? 'O alarmă activă' : active.length + ' alarme active'}: ${active.map(s => s.nume).join(', ')}. Verificați comenzile.`
      : atentie.length ? `▲ Atenție: ${atentie.map(s => s.nume.toLowerCase()).join(', ')} în afara intervalului normal.` : '● Toate valorile sunt în limite normale.';
    $('jurnal').innerHTML = jurnal.length ? jurnal.slice(0, 8).map((a, i) => `<tr class="${a.ok ? 'text-secondary' : ''}"><td>${a.ora}</td><td class="d-none d-sm-table-cell">${S[a.k].nume}</td>
      <td><span class="badge text-bg-${ETICHETE[a.st][1]}">${ETICHETE[a.st][2]}</span> <span class="d-sm-none">${S[a.k].nume}. </span>${a.text}</td>
      <td class="text-end">${a.ok ? 'Confirmată' : `<button class="btn btn-sm btn-outline-secondary" data-i="${i}">Confirmă</button>`}</td></tr>`).join('')
      : '<tr><td colspan="4" class="text-secondary">Nicio alarmă înregistrată.</td></tr>';
    $('irigareText').textContent = irigare > 0 ? `Irigare în curs: mai sunt ${irigare * 2} secunde.` : 'Irigarea este oprită.';
    $('irigare').textContent = irigare > 0 ? 'Oprește irigarea' : 'Pornește irigarea (1 minut)';
    $('ceas').textContent = ora(d);
  }
  function adaugaPunct(d = new Date()) {
    grafic.data.labels.push(ora(d)); grafic.data.datasets[0].data.push(S.temp.val); grafic.data.datasets[1].data.push(S.sol.val);
    if (grafic.data.labels.length > 60) { grafic.data.labels.shift(); grafic.data.datasets.forEach(ds => ds.data.shift()); }
    grafic.update();
  }

  ['vent', 'inc'].forEach(k => $(k).addEventListener('change', e => {
    cmd[k] = e.target.checked;
    $(k + 'Text').textContent = cmd[k] ? 'pornită' : 'oprită';
  }));
  $('irigare').addEventListener('click', () => {
    if (irigare > 0) irigare = 0;
    else if (confirm('Porniți irigarea pentru un minut?')) irigare = 30;
    actualizeaza();
  });
  $('jurnal').addEventListener('click', e => { if (e.target.dataset.i) { jurnal[e.target.dataset.i].ok = true; actualizeaza(); } });

  // Istoric initial (ultimele 40 de secunde), apoi actualizare la fiecare 2 secunde
  for (let i = 20; i > 0; i--) { const d = new Date(Date.now() - i * 2000); simuleaza(); actualizeaza(d); adaugaPunct(d); }
  setInterval(() => { simuleaza(); actualizeaza(); adaugaPunct(); }, 2000);
</script>
<script src="../../assets/nivel.js" data-nivel="3"></script>
</body>
</html>
