<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automat de bilete</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #eef3f8; padding-bottom: 90px; }
    .antet { background: #0b4f9c; color: #fff; }
    .tip { width: 100%; min-height: 88px; text-align: left; padding: .9rem 1rem; border: 2px solid #cfdbe8; border-radius: .75rem; background: #fff; }
    .tip:hover { border-color: #5b8fd0; }
    .tip.activ { border-color: #0b4f9c; background: #eaf2fc; box-shadow: 0 0 0 .25rem rgba(11, 79, 156, .15); }
    .tip .pret { font-weight: 700; color: #0b4f9c; }
    .cant { width: 4rem; font-size: 1.4rem; text-align: center; }
    .stepper .btn { width: 3.2rem; font-size: 1.4rem; }
  </style>
</head>
<body>
  <header class="antet py-3 mb-4"><div class="container"><h1 class="h4 mb-0">Bilete autobuz</h1>
    <small class="opacity-75">Transport public local · plata cu cardul sau numerar</small></div></header>
  <main class="container">
    <div class="row g-4">
      <section class="col-lg-8">
        <h2 class="h5 mb-3">1. Tipul biletului</h2>
        <div id="tipuri" class="row row-cols-1 row-cols-sm-2 g-3 mb-4"></div>
        <h2 class="h5 mb-3">2. Categoria de călător</h2>
        <div id="categorii" class="btn-group w-100 mb-1" role="group"></div>
        <p id="infoCateg" class="small text-body-secondary mb-4">Prețul întreg, fără reducere.</p>
        <h2 class="h5 mb-3">3. Câte bilete?</h2>
        <div class="d-flex align-items-center gap-3 stepper">
          <button id="minus" class="btn btn-outline-primary" title="Mai puține bilete">−</button>
          <output id="nr" class="cant fw-bold">1</output>
          <button id="plus" class="btn btn-outline-primary" title="Mai multe bilete">+</button>
          <span id="infoNr" class="small text-body-secondary">între 1 și 10 bilete</span>
        </div>
      </section>
      <aside class="col-lg-4">
        <div class="card border-0 shadow-sm"><div class="card-body p-4">
          <h2 class="h5">Comanda dvs.</h2>
          <table class="table table-sm mb-3"><tbody id="rezumat"></tbody></table>
          <div class="d-flex justify-content-between align-items-baseline mb-3"><span>Total de plată</span><span id="total" class="fs-3 fw-bold text-primary"></span></div>
          <button id="plateste" class="btn btn-primary btn-lg w-100 py-3">Plătește</button>
          <button id="reset" class="btn btn-link btn-sm w-100 mt-2 text-body-secondary">Reîncepe comanda</button>
        </div></div>
      </aside>
    </div>
  </main>
  <div class="modal fade" id="plata" tabindex="-1" aria-labelledby="tPlata" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5" id="tPlata">Plata</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Închide"></button></div>
    <div class="modal-body" id="corpPlata"></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Tarife si categorii (reducerile sunt procente din pretul intreg)
    const TIPURI = [
      { nume: 'O călătorie', pret: 3, info: 'Valabil 60 de minute de la validare, cu schimbare de linie.' },
      { nume: 'Două călătorii', pret: 5.5, info: 'Două validări separate; fiecare este valabilă 60 de minute.' },
      { nume: 'Abonament 1 zi', pret: 10, info: 'Călătorii nelimitate până la ora 24:00 a zilei validării.' },
      { nume: 'Abonament 7 zile', pret: 40, info: 'Călătorii nelimitate 7 zile consecutive de la prima validare.' },
    ];
    const CATEG = [
      { nume: 'Normal', red: 0, info: 'Prețul întreg, fără reducere.' },
      { nume: 'Elev / student', red: 50, info: 'Reducere 50%. Păstrați carnetul de elev sau de student pentru control.' },
      { nume: 'Pensionar', red: 50, info: 'Reducere 50%. Păstrați cuponul de pensie sau legitimația pentru control.' },
    ];
    let tip = 0, categ = 0, nr = 1;
    const $ = id => document.getElementById(id);
    const lei = v => v.toLocaleString('ro-RO', { minimumFractionDigits: 2 }) + ' lei';
    const modal = new bootstrap.Modal($('plata'));
    const total = () => TIPURI[tip].pret * nr * (100 - CATEG[categ].red) / 100;

    TIPURI.forEach((t, i) => $('tipuri').insertAdjacentHTML('beforeend', `<div class="col">
      <button class="tip" data-i="${i}" data-bs-toggle="tooltip" title="${t.info}">
        <span class="d-block fw-semibold">${t.nume}</span><span class="pret">${lei(t.pret)}</span></button></div>`));
    CATEG.forEach((c, i) => $('categorii').insertAdjacentHTML('beforeend',
      `<button class="btn btn-outline-primary py-2" data-c="${i}">${c.nume}${c.red ? ' −' + c.red + '%' : ''}</button>`));
    document.querySelectorAll('[title]').forEach(el => new bootstrap.Tooltip(el));

    function actualizeaza() {
      document.querySelectorAll('.tip').forEach(b => b.classList.toggle('activ', +b.dataset.i === tip));
      document.querySelectorAll('[data-c]').forEach(b => b.classList.toggle('active', +b.dataset.c === categ));
      $('infoCateg').textContent = CATEG[categ].info;
      $('nr').textContent = nr;
      $('minus').disabled = nr <= 1; $('plus').disabled = nr >= 10;
      $('infoNr').textContent = nr >= 10 ? 'Maximum 10 bilete într-o tranzacție.' : 'între 1 și 10 bilete';
      $('infoNr').className = 'small ' + (nr >= 10 ? 'text-warning-emphasis' : 'text-body-secondary');
      $('rezumat').innerHTML = `<tr><td>Bilet</td><td class="text-end">${TIPURI[tip].nume}</td></tr>
        <tr><td>Preț unitar</td><td class="text-end">${lei(TIPURI[tip].pret)}</td></tr>
        <tr><td>Cantitate</td><td class="text-end">${nr}</td></tr>
        <tr><td>Reducere</td><td class="text-end">${CATEG[categ].red ? '−' + CATEG[categ].red + '% (' + CATEG[categ].nume.toLowerCase() + ')' : '—'}</td></tr>`;
      $('total').textContent = lei(total());
      $('plateste').textContent = 'Plătește ' + lei(total());
    }

    // Plata: alegerea metodei, apoi confirmarea si biletul
    function alegeMetoda() {
      $('corpPlata').innerHTML = `<p>Total de plată: <strong>${lei(total())}</strong>. Alegeți metoda:</p>
        <div class="d-grid gap-2"><button class="btn btn-primary btn-lg" id="mCard">Card (contactless)</button>
        <button class="btn btn-outline-primary btn-lg" id="mNumerar">Numerar</button></div>`;
      $('mCard').onclick = () => proceseaza('Apropiați cardul de cititor…', 0);
      $('mNumerar').onclick = () => {
        $('corpPlata').innerHTML = `<label for="suma" class="form-label">Suma introdusă (lei)</label>
          <input id="suma" class="form-control form-control-lg" inputmode="decimal" placeholder="de exemplu 10">
          <div class="invalid-feedback" id="eroare"></div><div class="form-text">Automatul dă rest în monede.</div>
          <button class="btn btn-primary btn-lg w-100 mt-3" id="confirma">Confirmă plata</button>`;
        $('suma').focus();
        $('confirma').onclick = () => {
          const s = parseFloat($('suma').value.replace(',', '.'));
          if (isNaN(s)) return eroare('Introduceți suma în lei, de exemplu 10 sau 7,50.');
          if (s < total()) return eroare(`Suma este mai mică decât totalul. Mai introduceți ${lei(total() - s)}.`);
          proceseaza('Se verifică bancnotele…', s - total());
        };
      };
    }
    function eroare(t) { $('suma').classList.add('is-invalid'); $('eroare').textContent = t; }
    function proceseaza(text, rest) {
      $('corpPlata').innerHTML = `<div class="text-center py-4"><div class="spinner-border text-primary mb-3"></div><p class="mb-0">${text}</p></div>`;
      setTimeout(() => {
        const cod = Math.random().toString(36).slice(2, 8).toUpperCase();
        $('corpPlata').innerHTML = `<div class="alert alert-success">Plata a fost acceptată. Ridicați biletul din fanta de jos.${rest > 0 ? ' Rest: ' + lei(rest) + '.' : ''}</div>
          <div class="border rounded p-3 bg-body-tertiary"><div class="fw-bold">${nr} × ${TIPURI[tip].nume}</div>
          <div class="small">${CATEG[categ].nume} · ${lei(total())} · cod ${cod}</div><div class="small text-body-secondary">${TIPURI[tip].info}</div></div>
          <button class="btn btn-outline-primary w-100 mt-3" data-bs-dismiss="modal">Gata</button>`;
        tip = 0; categ = 0; nr = 1; actualizeaza();
      }, 1500);
    }

    $('tipuri').addEventListener('click', e => { const b = e.target.closest('.tip'); if (b) { tip = +b.dataset.i; actualizeaza(); } });
    $('categorii').addEventListener('click', e => { if (e.target.dataset.c) { categ = +e.target.dataset.c; actualizeaza(); } });
    $('minus').onclick = () => { nr = Math.max(1, nr - 1); actualizeaza(); };
    $('plus').onclick = () => { nr = Math.min(10, nr + 1); actualizeaza(); };
    $('plateste').onclick = () => { alegeMetoda(); modal.show(); };
    $('reset').onclick = () => { tip = 0; categ = 0; nr = 1; actualizeaza(); };
    actualizeaza();
  </script>
  <script src="../../assets/nivel.js" data-nivel="3"></script>
</body>
</html>
