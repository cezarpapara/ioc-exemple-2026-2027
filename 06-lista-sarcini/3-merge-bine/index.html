<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listă de sarcini</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .gata .form-check-label { text-decoration: line-through; color: var(--bs-secondary-color); }
    .list-group-item { transition: background-color .2s; }
  </style>
</head>
<body class="bg-body-tertiary">
<main class="container py-4" style="max-width: 680px">
  <h1 class="h3 mb-1">Sarcinile mele</h1>
  <p class="text-secondary" id="rezumat"></p>
  <div id="mesaj"></div>

  <form id="form" class="card card-body shadow-sm mb-3" novalidate>
    <label class="form-label fw-semibold" for="text">Sarcină nouă</label>
    <div class="row g-2">
      <div class="col-sm"><input class="form-control" id="text" placeholder="de exemplu: Citesc cursul 9" autocomplete="off">
        <div class="invalid-feedback">Scrieți sarcina (cel puțin 3 caractere).</div></div>
      <div class="col-7 col-sm-auto"><select class="form-select" id="prioritate" aria-label="Prioritate" data-bs-toggle="tooltip" data-bs-title="Prioritatea sarcinii">
        <option value="normal">Normală</option><option value="mare">Importantă</option></select></div>
      <div class="col-5 col-sm-auto d-grid"><button class="btn btn-primary">Adaugă</button></div>
    </div>
  </form>

  <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
    <div class="btn-group btn-group-sm" id="filtre">
      <button class="btn btn-outline-primary active" data-f="toate">Toate</button>
      <button class="btn btn-outline-primary" data-f="active">Active</button>
      <button class="btn btn-outline-primary" data-f="gata">Finalizate</button>
    </div>
    <button class="btn btn-sm btn-outline-danger ms-auto" id="curata" data-bs-toggle="tooltip" data-bs-title="Elimină din listă toate sarcinile bifate">Șterge finalizatele</button>
  </div>
  <ul class="list-group shadow-sm" id="lista"></ul>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let sarcini = [
    { id: 1, text: 'Citesc prezentarea de la cursul 9', gata: false, prioritate: 'mare' },
    { id: 2, text: 'Completez chestionarul SUS', gata: true, prioritate: 'normal' },
    { id: 3, text: 'Trimit tema de laborator', gata: false, prioritate: 'normal' },
  ];
  let filtru = 'toate', urmatorulId = 4;
  const $ = id => document.getElementById(id);
  // Textul introdus de utilizator nu se pune direct in HTML
  const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const GOL = { toate: 'Lista este goală. Adăugați prima sarcină folosind formularul de mai sus.',
    active: 'Nu aveți sarcini active. Bravo!', gata: 'Nu aveți încă sarcini finalizate. Bifați o sarcină când o terminați.' };

  function initTooltips() {
    document.querySelectorAll('.tooltip').forEach(t => t.remove());
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => bootstrap.Tooltip.getOrCreateInstance(el));
  }
  function anunta(text, tip = 'success') {
    $('mesaj').innerHTML = `<div class="alert alert-${tip} alert-dismissible fade show py-2" role="alert">${text}
      <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Închide"></button></div>`;
  }

  function afiseaza() {
    const active = sarcini.filter(s => !s.gata).length, gata = sarcini.length - active;
    $('rezumat').textContent = sarcini.length ? `${active} active, ${gata} finalizate` : 'Nicio sarcină încă';
    ['Toate', 'Active', 'Finalizate'].forEach((t, i) => $('filtre').children[i].textContent = `${t} (${[sarcini.length, active, gata][i]})`);
    $('curata').disabled = gata === 0;
    const vizibile = sarcini.filter(s => filtru === 'toate' || (filtru === 'gata') === s.gata);
    $('lista').innerHTML = vizibile.length ? vizibile.map(s => `
      <li class="list-group-item d-flex align-items-center gap-2 py-2 ${s.gata ? 'gata' : ''}">
        <div class="form-check me-auto mb-0">
          <input class="form-check-input" type="checkbox" id="s${s.id}" data-id="${s.id}" ${s.gata ? 'checked' : ''}>
          <label class="form-check-label" for="s${s.id}">${esc(s.text)}</label>
        </div>
        ${s.prioritate === 'mare' ? '<span class="badge text-bg-warning">Importantă</span>' : ''}
        <button class="btn btn-sm btn-outline-danger" data-sterge="${s.id}" data-bs-toggle="tooltip" data-bs-placement="left" data-bs-title="Șterge sarcina">Șterge</button>
      </li>`).join('') : `<li class="list-group-item text-secondary text-center py-4">${GOL[filtru]}</li>`;
    initTooltips();
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = $('text').value.trim();
    $('text').classList.toggle('is-invalid', text.length < 3);
    if (text.length < 3) return $('text').focus();
    sarcini.push({ id: urmatorulId++, text, gata: false, prioritate: $('prioritate').value });
    $('text').value = '';
    afiseaza();
    anunta(`Sarcina „${esc(text)}” a fost adăugată.`);
  });

  $('lista').addEventListener('change', e => {
    const s = sarcini.find(x => x.id === Number(e.target.dataset.id));
    s.gata = e.target.checked;
    afiseaza();
    anunta(s.gata ? `Ați finalizat „${esc(s.text)}”.` : `„${esc(s.text)}” este din nou activă.`, 'info');
  });

  $('lista').addEventListener('click', e => {
    const id = Number(e.target.dataset.sterge);
    if (!id) return;
    const s = sarcini.find(x => x.id === id);
    if (!confirm(`Ștergeți sarcina „${s.text}”?`)) return;
    sarcini = sarcini.filter(x => x.id !== id);
    afiseaza();
    anunta('Sarcina a fost ștearsă.', 'secondary');
  });

  $('filtre').addEventListener('click', e => {
    if (!e.target.dataset.f) return;
    filtru = e.target.dataset.f;
    [...$('filtre').children].forEach(b => b.classList.toggle('active', b === e.target));
    afiseaza();
  });

  $('curata').addEventListener('click', () => {
    const n = sarcini.filter(s => s.gata).length;
    if (!confirm(`Ștergeți ${n === 1 ? 'sarcina finalizată' : n + ' sarcini finalizate'}?`)) return;
    sarcini = sarcini.filter(s => !s.gata);
    afiseaza();
    anunta(n === 1 ? 'A fost ștearsă o sarcină finalizată.' : `Au fost șterse ${n} sarcini finalizate.`, 'secondary');
  });

  afiseaza();
</script>
<script src="../../assets/nivel.js" data-nivel="3"></script>
</body>
</html>
