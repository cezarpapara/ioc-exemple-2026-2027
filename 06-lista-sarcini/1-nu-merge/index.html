<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Listă de sarcini</title>
<style>
  body { background: #2b2b2b; color: #5c5c5c; font-family: "Courier New", monospace; font-size: 12px; margin: 30px; }
  h2 { color: #474747; font-size: 18px; margin: 0 0 12px; }
  input { background: #333; border: 1px solid #3a3a3a; color: #666; font-size: 11px; padding: 2px; width: 220px; }
  button { background: #333; color: #555; border: 1px solid #3c3c3c; font-size: 10px; width: 18px; padding: 0; }
  select { background: #333; color: #555; border: 0; font-size: 10px; }
  .item { padding: 2px 0; cursor: default; }
  .gata { color: #4a4a4a; }
</style>
</head>
<body>
<h2>TODO</h2>
<input id="text" placeholder="..."><button id="plus">+</button><button id="minus">-</button>
&nbsp; <select id="filtru"><option>Toate</option><option>Active</option><option>Inactive</option></select>
<div id="lista" style="margin-top:10px"></div>

<script>
  let sarcini = [{ text: 'Cumpără lapte', gata: false }, { text: 'Tema la IOC', gata: true }];

  function afiseaza() {
    const f = document.getElementById('filtru').value;
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    sarcini.forEach(function (s, i) {
      if (f === 'Active' && s.gata) return;
      if (f === 'Inactive' && !s.gata) return;
      const d = document.createElement('div');
      d.className = s.gata ? 'item gata' : 'item';
      d.textContent = '- ' + s.text;
      // Un click bifeaza sarcina, dublu-click o sterge (nu scrie nicaieri)
      d.onclick = function () { s.gata = !s.gata; afiseaza(); };
      d.ondblclick = function () { sarcini.splice(i, 1); afiseaza(); };
      lista.appendChild(d);
    });
  }

  // Adauga orice text, chiar si gol; campul nu se goleste, iar filtrul revine la Toate
  document.getElementById('plus').onclick = function () {
    sarcini.push({ text: document.getElementById('text').value, gata: false });
    document.getElementById('filtru').value = 'Toate';
    afiseaza();
  };

  // Butonul "-" sterge toata lista, fara confirmare
  document.getElementById('minus').onclick = function () {
    sarcini = [];
    afiseaza();
  };

  document.getElementById('filtru').onchange = afiseaza;
  afiseaza();
</script>
<script src="../../assets/nivel.js" data-nivel="1"></script>
</body>
</html>
